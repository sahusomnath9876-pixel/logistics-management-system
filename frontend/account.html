<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | SuperCart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f7f7f5; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="min-h-screen text-gray-900 antialiased">
    <header class="border-b border-gray-200 bg-white">
        <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-5">
            <a href="index.html" class="font-serif text-2xl tracking-widest uppercase">SuperCart</a>
            <nav class="flex items-center gap-5 text-xs font-semibold uppercase tracking-widest">
                <a href="javascript:history.back()" class="text-gray-500 hover:text-gray-900">&larr; Back</a>
                <a href="orders.html" class="text-gray-500 hover:text-gray-900">My Orders</a>
                <button id="signOutButton" type="button" class="text-red-600 hover:text-red-800">Sign out</button>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-5xl px-6 py-12">
        <p class="text-xs font-medium uppercase tracking-[0.25em] text-gray-500">Account</p>
        <h1 class="mt-3 font-serif text-4xl">Your profile</h1>

        <section class="mt-8 grid gap-6 md:grid-cols-[260px_1fr]">
            <div class="flex h-fit flex-col items-center rounded-sm border border-gray-200 bg-white px-6 py-8">
                <div id="profileInitial" class="flex h-24 w-24 items-center justify-center rounded-full bg-gray-900 text-3xl font-semibold text-white">U</div>
                <p id="profileRole" class="mt-4 text-xs font-semibold uppercase tracking-widest text-gray-400">Customer</p>
            </div>

            <div class="rounded-sm border border-gray-200 bg-white p-6 sm:p-8">
                <div id="profileStatus" class="text-sm text-gray-500">Loading profile...</div>
                <dl id="profileDetails" class="hidden divide-y divide-gray-100">
                    <div class="grid grid-cols-3 gap-4 py-5"><dt class="text-sm text-gray-500">Name</dt><dd id="profileName" class="col-span-2 text-sm font-medium"></dd></div>
                    <div class="grid grid-cols-3 gap-4 py-5"><dt class="text-sm text-gray-500">Mobile</dt><dd id="profileMobile" class="col-span-2 text-sm font-medium"></dd></div>
                    <div class="grid grid-cols-3 gap-4 py-5"><dt class="text-sm text-gray-500">City</dt><dd id="profileCity" class="col-span-2 text-sm font-medium"></dd></div>
                    <div class="grid grid-cols-3 gap-4 py-5"><dt class="text-sm text-gray-500">Address</dt><dd id="profileAddress" class="col-span-2 text-sm font-medium"></dd></div>
                </dl>

                <div class="mt-8 flex flex-wrap gap-3">
                    <button id="editProfileButton" type="button" class="bg-gray-900 px-5 py-3 text-xs font-semibold uppercase tracking-widest text-white">Update profile</button>
                    <a href="orders.html" class="border border-gray-300 px-5 py-3 text-xs font-semibold uppercase tracking-widest text-gray-700 hover:border-gray-900">View orders</a>
                    <a href="payments.html" class="border border-gray-300 px-5 py-3 text-xs font-semibold uppercase tracking-widest text-gray-700 hover:border-gray-900">Checkout</a>
                </div>

                <div id="profileEdit" class="mt-8 hidden border-t border-gray-100 pt-6">
                    <h2 class="font-serif text-xl">Update delivery details</h2>
                    <form id="profileForm" class="mt-5 grid gap-4 sm:grid-cols-2">
                        <div>
                            <label for="cityInput" class="mb-2 block text-sm font-medium">City</label>
                            <input id="cityInput" name="city" required class="w-full rounded-sm border border-gray-300 px-4 py-3 outline-none focus:border-gray-900">
                        </div>
                        <div>
                            <label for="addressInput" class="mb-2 block text-sm font-medium">Delivery address</label>
                            <input id="addressInput" name="address" required placeholder="House, street, area, pincode" class="w-full rounded-sm border border-gray-300 px-4 py-3 outline-none focus:border-gray-900">
                        </div>
                        <p id="profileUpdateStatus" class="hidden rounded-sm px-4 py-3 text-sm sm:col-span-2" role="alert"></p>
                        <div class="flex gap-3 sm:col-span-2">
                            <button type="submit" class="bg-gray-900 px-5 py-3 text-xs font-semibold uppercase tracking-widest text-white">Save changes</button>
                            <button id="cancelProfileEdit" type="button" class="border border-gray-300 px-5 py-3 text-xs font-semibold uppercase tracking-widest text-gray-700">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000';
        const token = () => localStorage.getItem('access_token');

        if (!token()) {
            sessionStorage.setItem('login_return_url', 'account.html');
            window.location.href = 'login.html';
        }

        async function loadProfile() {
            try {
                const response = await fetch(`${API_BASE_URL}/customer/customer/view`, {
                    headers: { 'Authorization': 'Bearer ' + token() },
                });
                if (!response.ok) throw new Error('Unable to load profile.');
                const profile = await response.json();
                const user = profile[0] || {};
                const customer = profile[1] || {};

                document.getElementById('profileStatus').classList.add('hidden');
                document.getElementById('profileDetails').classList.remove('hidden');
                document.getElementById('profileName').textContent = user.name || 'Not available';
                document.getElementById('profileMobile').textContent = user.mobile_no || 'Not available';
                document.getElementById('profileCity').textContent = customer.city || 'Not available';
                document.getElementById('profileAddress').textContent = customer.address || 'Not provided';
                document.getElementById('cityInput').value = customer.city || '';
                document.getElementById('addressInput').value = customer.address && customer.address.toLowerCase() !== 'not added' ? customer.address : '';
                document.getElementById('profileInitial').textContent = (user.name || 'U').charAt(0).toUpperCase();
            } catch (error) {
                document.getElementById('profileStatus').textContent = error.message;
                document.getElementById('profileStatus').className = 'text-sm text-red-600';
            }
        }

        document.getElementById('signOutButton').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            localStorage.removeItem('token_type');
            localStorage.removeItem('user_role');
            localStorage.removeItem('warehouse_id');
            localStorage.removeItem('manager_id');
            window.location.href = 'login.html';
        });

        const profileEdit = document.getElementById('profileEdit');
        document.getElementById('editProfileButton').addEventListener('click', () => {
            profileEdit.classList.toggle('hidden');
            if (!profileEdit.classList.contains('hidden')) document.getElementById('cityInput').focus();
        });
        document.getElementById('cancelProfileEdit').addEventListener('click', () => profileEdit.classList.add('hidden'));

        document.getElementById('profileForm').addEventListener('submit', async event => {
            event.preventDefault();
            const city = document.getElementById('cityInput').value.trim();
            const address = document.getElementById('addressInput').value.trim();
            const status = document.getElementById('profileUpdateStatus');
            if (!city || !address) {
                status.textContent = 'City and delivery address are required.';
                status.className = 'rounded-sm bg-red-50 px-4 py-3 text-sm text-red-700 sm:col-span-2';
                return;
            }

            try {
                for (const [column, newData] of [['city', city], ['address', address]]) {
                    const response = await fetch(`${API_BASE_URL}/customer/update/self`, {
                        method: 'PATCH',
                        headers: { 'Authorization': 'Bearer ' + token(), 'Content-Type': 'application/json' },
                        body: JSON.stringify({ column, new_data: newData })
                    });
                    if (!response.ok) {
                        const result = await response.json().catch(() => ({}));
                        throw new Error(result.detail || result.message || 'Unable to update profile.');
                    }
                }
                status.textContent = 'Profile updated successfully.';
                status.className = 'rounded-sm bg-green-50 px-4 py-3 text-sm text-green-700 sm:col-span-2';
                await loadProfile();
                window.setTimeout(() => profileEdit.classList.add('hidden'), 800);
            } catch (error) {
                status.textContent = error.message;
                status.className = 'rounded-sm bg-red-50 px-4 py-3 text-sm text-red-700 sm:col-span-2';
            }
        });

        loadProfile();
    </script>
</body>
</html>
